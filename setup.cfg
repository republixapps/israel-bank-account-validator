[flake8]
ignore = D101,D104,D106,D203,D400,D401,D403,F403,W503,D100,D102,D103,C101,D107,C901,L001,D105,SCS108,PT023,PT001,E203,E501,D200,D202,D205,D208,D209,B007
exclude =
    .git,
    __pycache__,
    .venv,
    env,
    dist
filename =
    *.py
max-complexity=12
max-line-length=119
max-linenumber=500
accept-encodings=utf-8,utf-16
inline-quotes=single
multiline-quotes=double

[isort]
force_single_line=true
line_length=119
forced_separate=true
force_alphabetical_sort_within_sections=true
